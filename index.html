<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexander</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=DM+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #fff6d6;
  --ink: #1d2b53;
  --accent: #ff4f6d;
  --muted: #4a5578;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14182b;
    --ink: #fff2c2;
    --accent: #ff7b93;
    --muted: #b7bedb;
  }
}
:root[data-theme="dark"] {
  --bg: #14182b;
  --ink: #fff2c2;
  --accent: #ff7b93;
  --muted: #b7bedb;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "DM Sans", system-ui, sans-serif;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 24px;
}
main { max-width: 100%; }
h1 {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 800;
  font-size: clamp(2.8rem, 15vw, 8rem);
  line-height: 1;
  margin: 0 0 24px;
  overflow-wrap: anywhere;
}
p { font-size: clamp(1.1rem, 4vw, 1.5rem); color: var(--muted); margin: 0; }
.mark {
  display: inline-block;
  width: 72px;
  height: 8px;
  background: var(--accent);
  border-radius: 4px;
  margin-bottom: 28px;
}
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Alexander</h1>
  <p>Esta es mi primera página web.</p>
</main>
</body>
</html>
